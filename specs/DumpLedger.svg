<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1800" height="1380" viewBox="0 0 1800 1380"
     role="img" aria-labelledby="title desc">
  <title id="title">DumpLedger executable lifecycle</title>
  <desc id="desc">
    Compiler-compatible TLA+ lifecycle map showing checked case workflow,
    closure-time grant revocation, one-time upload grants, crash-safe vault
    promotion, validation, availability, rejection, and two-phase deletion.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55c2ff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#7c6cff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#55e6bd" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="availableFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b38"/>
      <stop offset="1" stop-color="#0d2d2d"/>
    </linearGradient>
    <linearGradient id="warningFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#442b20"/>
      <stop offset="1" stop-color="#2a2020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#63c7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#58e0b5"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ffad66"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ff7384"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#b39cff"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font: 700 35px Inter, "Segoe UI", Arial, sans-serif; fill: #f4f8ff; letter-spacing: -0.5px; }
      .subtitle { font: 400 16px Inter, "Segoe UI", Arial, sans-serif; fill: #91a6be; }
      .section-title { font: 700 15px Inter, "Segoe UI", Arial, sans-serif; fill: #dce9f8; letter-spacing: 1.8px; }
      .section-note { font: 400 13px Inter, "Segoe UI", Arial, sans-serif; fill: #7890aa; }
      .entity-title { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #f0f6ff; }
      .entity-note { font: 400 12px Inter, "Segoe UI", Arial, sans-serif; fill: #9bb0c8; }
      .state { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #f5f9ff; }
      .state-note { font: 400 12px Inter, "Segoe UI", Arial, sans-serif; fill: #9cafc5; }
      .action { font: 600 12px "SFMono-Regular", Consolas, monospace; fill: #b9dfff; }
      .action-fs { font: 600 12px "SFMono-Regular", Consolas, monospace; fill: #c9bfff; }
      .action-fail { font: 600 12px "SFMono-Regular", Consolas, monospace; fill: #ffc28c; }
      .action-purge { font: 600 12px "SFMono-Regular", Consolas, monospace; fill: #ff9aaa; }
      .badge { font: 600 10px "SFMono-Regular", Consolas, monospace; letter-spacing: 0.4px; }
      .invariant-title { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; fill: #e6f2ff; }
      .invariant-note { font: 400 11px Inter, "Segoe UI", Arial, sans-serif; fill: #94a9c1; }
      .panel { fill: #0d1a2c; stroke: #20344c; stroke-width: 1.5; }
      .node { fill: #12243a; stroke: #365675; stroke-width: 1.7; }
      .node-muted { fill: #131f30; stroke: #33475e; stroke-width: 1.7; }
      .edge { fill: none; stroke: #63c7ff; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .edge-green { fill: none; stroke: #58e0b5; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .edge-fail { fill: none; stroke: #ffad66; stroke-width: 2.4; marker-end: url(#arrowOrange); }
      .edge-purge { fill: none; stroke: #ff7384; stroke-width: 2.4; marker-end: url(#arrowRed); }
      .edge-purple { fill: none; stroke: #b39cff; stroke-width: 2.4; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1800" height="1380" fill="url(#background)"/>
  <circle cx="1630" cy="40" r="280" fill="#3d73ff" opacity="0.045"/>
  <circle cx="120" cy="1020" r="260" fill="#29d8a5" opacity="0.035"/>

  <!-- Title -->
  <g class="sans">
    <text x="60" y="58" class="title">DumpLedger lifecycle</text>
    <text x="60" y="84" class="subtitle">Executable case, grant, and dump state model · Seq/Set integer slots · explicit action inputs</text>
    <g transform="translate(1505 38)">
      <rect width="235" height="45" rx="22.5" fill="#101f34" stroke="#2a4564"/>
      <circle cx="24" cy="22.5" r="6" fill="#58e0b5" filter="url(#softGlow)"/>
      <text x="42" y="27" class="mono" font-size="12" fill="#bdd0e5">SafetyInvariant / Next</text>
    </g>
  </g>

  <!-- Association chain -->
  <g filter="url(#shadow)">
    <rect x="60" y="112" width="1680" height="132" rx="20" class="panel"/>
    <rect x="60" y="112" width="1680" height="132" rx="20" fill="url(#headerGlow)"/>
  </g>
  <text x="88" y="143" class="section-title">ASSOCIATION CHAIN</text>
  <text x="88" y="164" class="section-note">Ownership is fixed before uploaded bytes are trusted.</text>
  <text x="88" y="190" class="action">action_taken · parameters</text>
  <text x="88" y="210" class="entity-note">{ case: Int, token: Int, dump: Int, kind: Str }</text>

  <g filter="url(#shadow)">
    <rect x="350" y="139" width="225" height="76" rx="14" fill="#122b42" stroke="#3f77a0"/>
    <rect x="698" y="139" width="225" height="76" rx="14" fill="#252044" stroke="#7467b1"/>
    <rect x="1046" y="139" width="225" height="76" rx="14" fill="#12333a" stroke="#3d8e91"/>
    <rect x="1394" y="139" width="225" height="76" rx="14" fill="#173329" stroke="#4d9274"/>
  </g>
  <text x="374" y="171" class="entity-title">Customer</text>
  <text x="374" y="193" class="entity-note">CaseCustomer[c] = customer</text>
  <text x="722" y="171" class="entity-title">Case</text>
  <text x="722" y="193" class="entity-note">TokenCase[t] = case</text>
  <text x="1070" y="171" class="entity-title">Upload grant</text>
  <text x="1070" y="193" class="entity-note">one case · one use</text>
  <text x="1418" y="171" class="entity-title">Dump</text>
  <text x="1418" y="193" class="entity-note">immutable dumpCase[d]</text>

  <path d="M575 177 H688" class="edge"/>
  <path d="M923 177 H1036" class="edge-purple"/>
  <path d="M1271 177 H1384" class="edge-green"/>
  <text x="626" y="164" class="action">owns</text>
  <text x="971" y="164" class="action">binds</text>
  <text x="1287" y="164" class="action">BeginUpload</text>

  <!-- Case workflow -->
  <g filter="url(#shadow)">
    <rect x="60" y="270" width="1680" height="220" rx="20" class="panel"/>
  </g>
  <text x="88" y="306" class="section-title">CASE WORKFLOW</text>
  <text x="88" y="327" class="section-note">Checked actions: StartInvestigation · WaitForCustomer · ResolveCase · ResumeInvestigation · CloseCase.</text>
  <g transform="translate(1408 287)">
    <rect width="300" height="28" rx="14" fill="#102a28" stroke="#327963"/>
    <circle cx="16" cy="14" r="4" fill="#58e0b5"/>
    <text x="29" y="18" class="badge" fill="#a9efd8">caseStatus · CHECKED IN SafetyInvariant</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="363" width="180" height="72" rx="16" class="node-muted"/>
    <rect x="420" y="363" width="220" height="72" rx="16" class="node"/>
    <rect x="750" y="363" width="270" height="72" rx="16" fill="#33291f" stroke="#8d6842" stroke-width="1.7"/>
    <rect x="1140" y="363" width="210" height="72" rx="16" fill="#173329" stroke="#4d9274" stroke-width="1.7"/>
    <rect x="1480" y="363" width="180" height="72" rx="16" fill="#2b1b25" stroke="#784154" stroke-width="1.7"/>
  </g>
  <text x="210" y="406" text-anchor="middle" class="state">new</text>
  <text x="530" y="406" text-anchor="middle" class="state">investigating</text>
  <text x="885" y="406" text-anchor="middle" class="state">waiting-for-customer</text>
  <text x="1245" y="406" text-anchor="middle" class="state">resolved</text>
  <text x="1570" y="406" text-anchor="middle" class="state">closed</text>

  <path d="M300 399 H410" class="edge"/>
  <path d="M640 399 H740" class="edge"/>
  <path d="M1020 399 H1130" class="edge"/>
  <path d="M1350 399 H1470" class="edge"/>

  <g transform="translate(88 449)">
    <rect width="500" height="22" rx="11" fill="#101f33" stroke="#2b4f70"/>
    <text x="250" y="15" text-anchor="middle" class="badge" fill="#b9dfff">ResolveCase: investigating | waiting-for-customer → resolved</text>
    <rect x="512" width="580" height="22" rx="11" fill="#101f33" stroke="#2b4f70"/>
    <text x="802" y="15" text-anchor="middle" class="badge" fill="#b9dfff">ResumeInvestigation: waiting-for-customer | resolved | closed → investigating</text>
    <rect x="1104" width="516" height="22" rx="11" fill="#2b241d" stroke="#805537"/>
    <text x="1362" y="15" text-anchor="middle" class="badge" fill="#ffd0a4">CloseCase: resolved → closed + revoke issued grants</text>
  </g>

  <!-- Remaining executable DumpLedger.tla panels. -->
  <g transform="translate(0 250)">
  <!-- Upload grant lifecycle -->
  <g filter="url(#shadow)">
    <rect x="60" y="270" width="1680" height="220" rx="20" class="panel"/>
  </g>
  <text x="88" y="306" class="section-title">UPLOAD GRANT LIFECYCLE</text>
  <text x="88" y="327" class="section-note">Terminal grants cannot be issued again.</text>

  <g transform="translate(1560 289)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#63c7ff" stroke-width="2.4"/>
    <text x="42" y="4" class="entity-note">normal</text>
    <line x1="0" y1="24" x2="32" y2="24" stroke="#ffad66" stroke-width="2.4"/>
    <text x="42" y="28" class="entity-note">terminal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="170" y="357" width="190" height="82" rx="16" class="node-muted"/>
    <rect x="510" y="357" width="190" height="82" rx="16" class="node"/>
    <rect x="895" y="357" width="210" height="82" rx="16" fill="#113339" stroke="#3f9291" stroke-width="1.7"/>
    <rect x="1285" y="334" width="190" height="64" rx="16" fill="url(#warningFill)" stroke="#a66843" stroke-width="1.7"/>
    <rect x="1285" y="419" width="190" height="64" rx="16" fill="url(#warningFill)" stroke="#a66843" stroke-width="1.7"/>
  </g>
  <text x="265" y="393" text-anchor="middle" class="state">unused</text>
  <text x="265" y="416" text-anchor="middle" class="state-note">not delivered</text>
  <text x="605" y="393" text-anchor="middle" class="state">issued</text>
  <text x="605" y="416" text-anchor="middle" class="state-note">case-bound secret</text>
  <text x="1000" y="393" text-anchor="middle" class="state">consumed</text>
  <text x="1000" y="416" text-anchor="middle" class="state-note">tokenDump[t] = d</text>
  <text x="1380" y="373" text-anchor="middle" class="state">revoked</text>
  <text x="1380" y="458" text-anchor="middle" class="state">expired</text>

  <path d="M360 398 H500" class="edge"/>
  <path d="M700 398 H885" class="edge-green"/>
  <path d="M700 382 C890 295 1090 310 1275 356" class="edge-fail"/>
  <path d="M700 414 C900 493 1085 493 1275 456" class="edge-fail"/>
  <text x="403" y="384" class="action">IssueToken(t)</text>
  <text x="744" y="384" class="action">BeginUpload(t,d)</text>
  <text x="925" y="316" class="action-fail">RevokeToken(t)</text>
  <text x="927" y="474" class="action-fail">ExpireToken(t)</text>

  <!-- Dump lifecycle -->
  <g filter="url(#shadow)">
    <rect x="60" y="516" width="1680" height="418" rx="20" class="panel"/>
  </g>
  <text x="88" y="553" class="section-title">DUMP LIFECYCLE</text>
  <text x="88" y="574" class="section-note">Only available dumps are downloadable. Stuttering represents a pause or crash.</text>

  <g transform="translate(1370 543)">
    <rect width="116" height="24" rx="12" fill="#172a40" stroke="#365675"/>
    <circle cx="14" cy="12" r="4" fill="#63c7ff"/>
    <text x="26" y="16" class="badge" fill="#a9c9e5">LEDGER</text>
    <rect x="128" width="126" height="24" rx="12" fill="#281f3d" stroke="#64558f"/>
    <circle cx="142" cy="12" r="4" fill="#b39cff"/>
    <text x="154" y="16" class="badge" fill="#c9bfff">FILESYSTEM</text>
    <rect x="266" width="116" height="24" rx="12" fill="#33251c" stroke="#805537"/>
    <circle cx="280" cy="12" r="4" fill="#ffad66"/>
    <text x="292" y="16" class="badge" fill="#ffd0a4">FAILURE</text>
  </g>

  <!-- Main lifecycle nodes -->
  <g filter="url(#shadow)">
    <rect x="94" y="650" width="160" height="100" rx="17" class="node-muted"/>
    <rect x="306" y="650" width="180" height="100" rx="17" class="node"/>
    <rect x="538" y="650" width="180" height="100" rx="17" class="node"/>
    <rect x="770" y="650" width="200" height="100" rx="17" fill="#202442" stroke="#6566a1" stroke-width="1.7"/>
    <rect x="1022" y="650" width="190" height="100" rx="17" fill="url(#availableFill)" stroke="#45a582" stroke-width="1.9"/>
    <rect x="1328" y="650" width="170" height="100" rx="17" fill="#3a202b" stroke="#ad5265" stroke-width="1.8"/>
    <rect x="1550" y="650" width="150" height="100" rx="17" class="node-muted"/>
    <rect x="1022" y="818" width="190" height="88" rx="17" fill="url(#warningFill)" stroke="#a66843" stroke-width="1.8"/>
  </g>

  <text x="174" y="692" text-anchor="middle" class="state">absent</text>
  <text x="174" y="717" text-anchor="middle" class="state-note">case slot = 0</text>

  <text x="396" y="692" text-anchor="middle" class="state">receiving</text>
  <text x="396" y="717" text-anchor="middle" class="state-note">blob: staging</text>

  <text x="628" y="688" text-anchor="middle" class="state">sealed</text>
  <text x="628" y="711" text-anchor="middle" class="state-note">SHA-256 recorded</text>
  <text x="628" y="730" text-anchor="middle" class="state-note">blob: staging | vault</text>

  <text x="870" y="688" text-anchor="middle" class="state">quarantined</text>
  <text x="870" y="711" text-anchor="middle" class="state-note">blob: vault</text>
  <text x="870" y="730" text-anchor="middle" class="state-note">not downloadable</text>

  <text x="1117" y="688" text-anchor="middle" class="state">available</text>
  <text x="1117" y="711" text-anchor="middle" class="state-note">valid + classified</text>
  <g transform="translate(1061 721)">
    <rect width="112" height="20" rx="10" fill="#164b3e" stroke="#3a9d7c"/>
    <text x="56" y="14" text-anchor="middle" class="badge" fill="#8ef1cf">DOWNLOADABLE</text>
  </g>

  <text x="1413" y="692" text-anchor="middle" class="state">deleting</text>
  <text x="1413" y="717" text-anchor="middle" class="state-note">download disabled</text>

  <text x="1625" y="692" text-anchor="middle" class="state">deleted</text>
  <text x="1625" y="717" text-anchor="middle" class="state-note">blob: none</text>

  <text x="1117" y="854" text-anchor="middle" class="state">rejected</text>
  <text x="1117" y="878" text-anchor="middle" class="state-note">invalid | transfer-failed</text>

  <!-- Main lifecycle edges -->
  <path d="M254 700 H296" class="edge-green"/>
  <path d="M486 700 H528" class="edge"/>
  <path d="M718 700 H760" class="edge"/>
  <path d="M970 700 H1012" class="edge-green"/>
  <path d="M1212 700 H1318" class="edge-purge"/>
  <path d="M1498 700 H1540" class="edge-purge"/>

  <text x="267" y="629" class="action">BeginUpload(t,d)</text>
  <text x="491" y="629" class="action">SealUpload(d)</text>
  <text x="713" y="629" class="action">MarkQuarantined(d)</text>
  <text x="966" y="629" class="action">AcceptDump(d,kind)</text>
  <text x="1223" y="629" class="action-purge">BeginPurge(d)</text>
  <text x="1499" y="629" class="action-purge">FinishPurge(d)</text>

  <!-- Filesystem-only promotion loop -->
  <path d="M574 650 C552 590 704 590 684 650" class="edge-purple"/>
  <rect x="557" y="584" width="145" height="24" rx="12" fill="#281f3d" stroke="#64558f"/>
  <text x="629.5" y="600" text-anchor="middle" class="badge" fill="#cabfff">staging → vault</text>
  <text x="556" y="576" class="action-fs">PromoteObject(d)</text>

  <!-- Failure paths -->
  <path d="M396 750 C450 868 785 881 1012 865" class="edge-fail"/>
  <path d="M870 750 C892 822 950 856 1012 860" class="edge-fail"/>
  <path d="M1212 861 C1280 853 1368 805 1401 760" class="edge-purge"/>
  <text x="592" y="850" class="action-fail">FailUpload(d)</text>
  <text x="828" y="797" class="action-fail">RejectDump(d)</text>
  <text x="1240" y="839" class="action-purge">BeginPurge(d)</text>

  <!-- Safety invariants -->
  <rect x="60" y="962" width="1680" height="112" rx="20" fill="#0b1727" stroke="#28425e" stroke-width="1.5"/>
  <text x="88" y="997" class="section-title">CHECKED SAFETY INVARIANTS</text>

  <g transform="translate(88 1014)">
    <rect width="290" height="42" rx="12" fill="#101f33" stroke="#2b4f70"/>
    <circle cx="19" cy="21" r="6" fill="#63c7ff"/>
    <text x="36" y="18" class="invariant-title">AssociationIntegrity</text>
    <text x="36" y="33" class="invariant-note">assigned case never changes</text>
  </g>
  <g transform="translate(394 1014)">
    <rect width="290" height="42" rx="12" fill="#101f33" stroke="#2b4f70"/>
    <circle cx="19" cy="21" r="6" fill="#b39cff"/>
    <text x="36" y="18" class="invariant-title">TokenIntegrity</text>
    <text x="36" y="33" class="invariant-note">one grant claims at most one dump</text>
  </g>
  <g transform="translate(700 1014)">
    <rect width="340" height="42" rx="12" fill="#2b241d" stroke="#805537"/>
    <circle cx="19" cy="21" r="6" fill="#ffad66"/>
    <text x="36" y="18" class="invariant-title">ClosedCaseHasNoIssuedGrant</text>
    <text x="36" y="33" class="invariant-note">closure atomically revokes issued grants</text>
  </g>
  <g transform="translate(1056 1014)">
    <rect width="300" height="42" rx="12" fill="#102a28" stroke="#327963"/>
    <circle cx="19" cy="21" r="6" fill="#58e0b5"/>
    <text x="36" y="18" class="invariant-title">AvailableHasEvidence</text>
    <text x="36" y="33" class="invariant-note">vault + digest + valid + coverage</text>
  </g>
  <g transform="translate(1372 1014)">
    <rect width="340" height="42" rx="12" fill="#2b1b25" stroke="#784154"/>
    <circle cx="19" cy="21" r="6" fill="#ff7384"/>
    <text x="36" y="18" class="invariant-title">DeletedHasNoBlob</text>
    <text x="36" y="33" class="invariant-note">bytes gone; association tombstone remains</text>
  </g>

  <text x="60" y="1102" class="mono" font-size="11" fill="#60758e">DumpLedger.tla · caseStatus + grant/dump state · Seq/Set slots 1..2 · action_taken + closed parameters</text>
  <text x="1740" y="1102" text-anchor="end" class="mono" font-size="11" fill="#60758e">regenerated 2026-09-05</text>
  </g>
</svg>
